# ============================================================
# Publicação no Render (render.com)
# ------------------------------------------------------------
# Por que Render/Railway/Fly e não Vercel: este projeto é um
# servidor Node que fica ligado o tempo todo e guarda o banco
# (pantale.db) em arquivo. Na Vercel o código roda em funções
# que nascem e morrem a cada visita, e o disco é apagado a cada
# publicação — o banco com os clientes e pedidos iria junto.
#
# Como usar:
#   1. Suba este repositório para o GitHub
#   2. render.com > New > Blueprint > aponte para este repositório
#   3. O Render lê este arquivo e cria o serviço
#   4. Preencha as variáveis marcadas como sync:false no painel
#
# ATENÇÃO: o disco (disk) é o que mantém o banco vivo entre as
# publicações. Ele exige plano pago (Starter, ~US$7/mês). No
# plano gratuito o disco some e você perde os pedidos.
# ============================================================
services:
  - type: web
    name: pantale
    runtime: node
    plan: starter          # necessário para ter disco persistente
    region: oregon
    # De propósito SEM "rootDir: server". O código serve o index.html e
    # a pasta assets/ subindo um nível a partir de server/ (__dirname/..).
    # Com rootDir apontando pra server/, esse nível acima deixa de existir
    # no ambiente do Render, e o site inteiro (menos a API) vira 404 —
    # foi exatamente o que aconteceu na primeira publicação. Em vez disso,
    # entramos na pasta certa dentro do próprio comando.
    buildCommand: cd server && npm ci --omit=dev
    startCommand: cd server && npm start
    healthCheckPath: /robots.txt

    # Disco que sobrevive às publicações. O banco, os backups e as
    # chaves de sessão moram aqui.
    disk:
      name: pantale-dados
      mountPath: /var/data
      sizeGB: 1

    envVars:
      - key: NODE_VERSION
        value: "22.5.0"

      # Aponta o banco, as chaves e os backups para o disco acima.
      # SEM ISTO o disco não serve de nada: o código gravaria dentro
      # da pasta do projeto, que o Render apaga a cada publicação.
      - key: DATA_DIR
        value: /var/data

      # Endereço público do site. Ajuste se o domínio mudar.
      - key: SITE_URL
        value: https://pantale.com.br

      # --- Frete (Melhor Envio) ---
      # Regras de negócio, não credenciais: ficam aqui à vista, iguais em
      # qualquer cópia do serviço. Sem ME_ORIGIN_CEP o frete sobe DESLIGADO
      # e toda venda sai com entrega R$ 0 — foi o que já aconteceu uma vez.
      - key: ME_ORIGIN_CEP
        value: "79031907"
      # Acima deste valor (em reais) a entrega é por conta da loja.
      - key: ME_FREE_SHIPPING_MIN
        value: "397"
      # Dias entre a compra e a postagem. O prazo do Melhor Envio é só o
      # trânsito; sem somar isto o site promete ao cliente uma data que a
      # loja não alcança.
      - key: ME_HANDLING_DAYS
        value: "2"
      # Uma transportadora só, para a rotina de postagem ser um lugar só.
      - key: ME_ALLOWED_CARRIERS
        value: Correios

      # --- Preencher no painel do Render (nunca aqui no arquivo) ---
      # sync:false = o Render pede o valor na primeira publicação e
      # guarda criptografado, sem passar pelo git.
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_TO
        sync: false
      # Token de cotação do Melhor Envio (escopo shipping-calculate).
      # Este é segredo, então só o nome mora aqui.
      - key: ME_TOKEN
        sync: false
